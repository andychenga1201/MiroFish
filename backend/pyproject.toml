[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    
    # OASIS 社交媒体模拟. Stay on 0.2.5: 0.2.6 still indexes post_table[-1]
    # and still pins the same vulnerable sentence-transformers and unstructured
    # releases. Python support is >=3.10,<3.12, so this project is 3.11 only.
    # The empty-table guard lives in backend/scripts/oasis_compat.py.
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# camel-oasis 0.2.5 exact-pins transitive copies that GitHub Advisory marks
# critical. unstructured>=0.24 needs psutil>=7.2.2, which is above camel-ai's
# psutil<6 cap; camel-ai only uses the stable Process/cpu/memory APIs.
# Overrides apply during uv resolution; they do not fork oasis.
[tool.uv]
override-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "fsspec>=2026.6.0",
    "lxml>=6.1.0",
    # mcp 2.x removes mcp.server.FastMCP, which camel-ai 0.2.78 imports.
    "mcp>=1.28.1,<2",
    "mistune>=3.3.0",
    "nbconvert>=7.17.2",
    "nltk>=3.10.3",
    "oauthlib>=4.0.1",
    "pillow>=13.0.0",
    "psutil>=7.2.2,<8",
    "pyjwt>=2.14.0",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.30",
    "sentence-transformers>=5.6.0",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
    "torch>=2.10.0",
    "tornado>=6.5.9",
    "unstructured>=0.24.0",
    "urllib3>=2.8.0",
]
